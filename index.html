<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>떡볶이 축제 체험기</title>
<style>
  :root { --ink:#2a1a14; --muted:#6b5a52; --accent:#e23b26; --paper:#fff; --bg:#f6f1ef; --line:#e7ddd8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; display: grid; gap: 16px; }
  .eyebrow { color: var(--accent); font-weight: 700; margin: 0; font-size: 14px; }
  h1 { margin: 4px 0 0; font-size: 30px; line-height: 1.25; }
  h1 span { color: var(--accent); }
  p.meta { color: var(--muted); margin: 6px 0 0; }
  a.card { display: flex; gap: 14px; align-items: center; padding: 18px; border-radius: 18px; background: var(--paper); border: 1px solid var(--line); color: inherit; text-decoration: none; }
  a.card:hover { border-color: var(--accent); }
  a.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .ic { font-size: 32px; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; background: #fdece8; flex: none; }
  .card b { display: block; font-size: 18px; }
  .card small { color: var(--muted); font-size: 14px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<main>

  </header>
  <a class="card" href="guide.html"><span class="ic">🧭</span><span><b>축제 스마트 가이드</b><small>부스 찾기 · 길 찾기 · 편의시설</small></span></a>

</html>
